services:
  numzscan:
    build: .
    container_name: numzscan-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${NUMZSCAN_DB_USER:-numzscan}:${NUMZSCAN_DB_PASSWORD}@infra-postgres:5432/${NUMZSCAN_DB_NAME:-numzscan}
      CORS_ORIGIN: ${NUMZSCAN_CORS_ORIGIN:-}
      # EventPass API v1 (and the React app's sign-in) is mounted only when this is set.
      EVENTPASS_TOKEN_KEY: ${EVENTPASS_TOKEN_KEY:-}
    ports:
      # Loopback — direct host-level access.
      - "127.0.0.1:${NUMZSCAN_HTTP_PORT:-3210}:3000"
      # Platform Gateway reachability — numzlab-platform-gateway reaches this
      # container via host.docker.internal, which resolves to the Docker bridge
      # gateway, not loopback. NUMZSCAN_GATEWAY_BIND_IP is a discovered runtime
      # value (docker network inspect bridge), not a hardcoded literal.
      - "${NUMZSCAN_GATEWAY_BIND_IP}:${NUMZSCAN_HTTP_PORT:-3210}:3000"
    networks:
      - infra
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  infra:
    external: true
