services:
  numzscan:
    build: .
    container_name: numzscan-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${NUMZSCAN_DB_USER:-numzscan}:${NUMZSCAN_DB_PASSWORD}@infra-postgres:5432/${NUMZSCAN_DB_NAME:-numzscan}
      CORS_ORIGIN: ${NUMZSCAN_CORS_ORIGIN:-}
      # EventPass API v1 (and the React app's sign-in) is mounted only when this is set.
      EVENTPASS_TOKEN_KEY: ${EVENTPASS_TOKEN_KEY:-}
      # Public address for registration links and QR codes. Set in .env; blank means no link is offered.
      EVENTPASS_PUBLIC_URL: ${EVENTPASS_PUBLIC_URL:-}
    networks:
      infra: {}
      # Private network shared with the NumzLab gateway. The gateway reaches this service as "eventpass".
      eventpass-private:
        aliases:
          - eventpass
        ipv4_address: 172.16.40.3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  infra:
    external: true
  # Dedicated gateway-to-EventPass network. Fixed name, subnet and bridge name: firewall identity must not depend on Docker-generated names.
  eventpass-private:
    name: eventpass-private
    driver_opts:
      com.docker.network.bridge.name: br-eventpriv
    ipam:
      config:
        - subnet: 172.16.40.0/24
          gateway: 172.16.40.1
